# English strings for Fetan Eta bot.
# {placeholders} are substituted at runtime - keep them, don't translate them.
# This file is also the fallback language: if a key is missing from another
# language file, the bot falls back to the value here.

# --- general / common.py ---
welcome: >-
  👋 Welcome to Fetan Eta!

  Tap a free number in the group to join the lottery. I'll send you the
  payment instructions here in a private message.
help: |-
  How does it work?
  1. Tap one of the free numbers in the group.
  2. Pay, then send the payment screenshot or the transaction ID here.
  3. Wait for admin approval.
  4. Once registration closes, winners are announced directly in the group.
  5. If you win, send your payout account (Telebirr/CBE/bank) here.
link_not_yours: |-
  🚫 This registration link isn't yours - it was generated for a different player to tap.

  Go back to the group and tap a free number yourself.
round_closed_suffix: "\n\nThis round is no longer open - go back to the group and tap a number that's currently available."
number_reserved_for_you: "👋 Welcome! Number {number} is reserved for you - see the payment info above ⬆️"
reserve_generic_error: "There was a problem holding that number. Please go back to the group and tap the number again."
you_already_hold_pending: "You already hold number {number} - see the payment info above 👆"
you_own_confirmed: "🎉 Number {number} is confirmed as yours!"
number_pending_other: "🟡 Number {number} is currently pending - {who} tapped it before you and is completing payment. Go back to the group and pick another number 👇"
number_reserved_other: "🟢 Number {number} is already taken by {who}. Go back to the group and pick another number 👇"
other_player: "another player"
no_pending_action: |-
  There's nothing for you to do right now. Go to the group and tap one of the free numbers to join the current round.

  If you're not sure how it works, type /help.
claim_received: |-
  Thank you! Your payout details have been sent to the admins. You'll get a confirmation message once the payment is made.

