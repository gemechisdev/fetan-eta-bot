# Afaan Oromoo strings for Fetan Eta bot.

welcome: >-
  👋 Baga nagaan gara Fetan Eta dhuftan!

  Lakkoofsa carraa keessanii garee(Telegram Group) keessatti tarreeffaman keessaa filachuun carraa keessan yaaluu dandeessu. Qajeelfama
  kaffaltii asitti dhuunfaan isiniif ergina.
help: |-
  Akkamitti hojjeta?
  1. Lakkoofsota carraa garee keessatti tarreeffaman jiran keessaa tokko tuqaa filadhaa.
  2. Kaffaltii raawwadhaa, ergasii suuraa ragaa kaffaltii ykn lakkoofsa daldalaa (Transaction ID) asitti ergaa.
  3. Mirkaneessa admin eegaa.
  4. Galmeen erga cufamee booda mo'attoonni garee keessatti kallattiin ni beeksifamu.
  5. Yoo mo'attan, herrega kaffaltii keessan (Telebirr/CBE/baankii) asitti erguun badhaasa keessan fudhadhaa.
link_not_yours: |-
  🚫 Liinkiin galmee kun kan keessan miti... kan taphataa biraan filate dha.

  Gara gareetti deebi'aa, lakkoofsa carraa kan biraa tuqaa filadhaa.
round_closed_suffix: "\n\nMarsaan kun ammas hin banamu — gara gareetti deebi'aa lakkoofsa marsaa ammaa argamu keessaa tuqaa filadhaa."
number_reserved_for_you: "👋 Baga nagaan dhuftan! Lakkoofsi {number} isiniif qabameera — odeeffannoo kaffaltii armaan olii ilaalaa ⬆️"
reserve_generic_error: "Lakkoofsa sana qabachuu keessatti rakkoon uumameera. Maaloo gara gareetti deebi'aa lakkoofsa sana irra deebi'aa tuqaa."
you_already_hold_pending: "Lakkoofsa {number} duraan qabdaniirtu — odeeffannoo kaffaltii armaan olii ilaalaa 👆"
you_own_confirmed: "🎉 Lakkoofsi {number} kan keessan ta'uun mirkanaa'eera!"
number_pending_other: "🟡 Lakkoofsi {number} yeroo ammaa kaffaltii eegaa jira — {who} isin dura tuqee kaffaltii xumuraa jira waan ta'eef, gara gareetti deebi'aa lakkoofsa biraa filadhaa 👇"
number_reserved_other: "🟢 Lakkoofsi {number} duraan {who}n qabameera. Gara gareetti deebi'aa lakkoofsa biraa filadhaa 👇"
other_player: "taphataa biraa"
no_pending_action: |-
  Yeroo ammaa wanti isin gochuu qabdan hin jiru. Gara gareetti deemuudhaan marsaa ammaa keessatti hirmaachuuf lakkoofsota carraa keessaa tokko tuqaa.

  Yoo haala hojii isaa hin hubatin /help barreessuun ergaa.
claim_received: |-
  Galatoomaa! Odeeffannoon herrega badhaasa keessan admin-iif ergameera. Kaffaltiin erga raawwatamee booda ergaa mirkaneessaa ni argattu.

