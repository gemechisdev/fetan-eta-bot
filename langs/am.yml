# Amharic strings for Fetan Eta bot.

welcome: >-
  👋 ወደ Fetan Eta(ፈጣን ዕጣ) እንኳን በደህና መጡ!

  ከግሩፑ ውስጥ ነጻ ቁጥርን በመንካት በሎተሪው ይሳተፉ። የክፍያ መመሪያዎችን እዚህ በግል መልዕክት እልክልዎታለሁ።
help: |-
  እንዴት ይሰራል?
  1. በግሩፑ ውስጥ ካሉት ነጻ ቁጥሮች አንዱን ይንኩ።
  2. ክፍያ ይፈጽሙ፣ ከዚያም የክፍያውን ስክሪንሾት ወይም የግብይት መለያ ቁጥሩን እዚህ ይላኩ።
  3. የአስተዳዳሪውን ማጽደቅ ይጠብቁ።
  4. ምዝገባው ከተዘጋ በኋላ አሸናፊዎች በግሩፑ ውስጥ በቀጥታ ይለያሉ።
  5. ካሸነፉ የሽልማት መቀበያ ሂሳብዎን (Telebirr/CBE/ባንክ) ይላኩ።
link_not_yours: |-
  🚫 ይህ የምዝገባ ሊንክ የእርስዎ አይደለም — ለሌላ ተጫዋች ጠቅ ማድረግ የተፈጠረ ነው።

  ወደ ግሩፑ በመሄድ እርስዎ ራስዎ ነጻ የሆነ ቁጥር ይንኩ እና ይምረጡ።
round_closed_suffix: "\n\nይህ ዙር ከእንግዲህ ክፍት አይደለም — ወደ ግሩፑ በመመለስ በአሁኑ ጊዜ የሚገኝ ቁጥር ይንኩ።"
number_reserved_for_you: "👋 እንኳን ደህና መጡ! ቁጥር {number} ለእርስዎ ተይዟል — ከላይ የክፍያ መረጃውን ይመልከቱ ⬆️"
reserve_generic_error: "ያንን ቁጥር በመያዝ ላይ ችግር ተፈጥሯል። እባክዎ ወደ ግሩፑ ተመልሰው ቁጥሩን እንደገና ይንኩ።"
you_already_hold_pending: "ቁጥር {number}ን አስቀድመው ይዘዋል — የክፍያ መረጃውን ከላይ ይመልከቱ 👆"
you_own_confirmed: "🎉 ቁጥር {number} የእርስዎ መሆኑ ተረጋግጧል!"
number_pending_other: "🟡 ቁጥር {number} በአሁኑ ጊዜ በመጠባበቅ ላይ ነው — {who} ከእርስዎ በፊት ነክቶታል እና ክፍያውን እያጠናቀቀ ነው። ወደ ግሩፑ ተመልሰው ሌላ ቁጥር ይምረጡ 👇"
number_reserved_other: "🟢 ቁጥር {number} አስቀድሞ በ{who} ተይዟል። ወደ ግሩፑ ተመልሰው ሌላ ቁጥር ይምረጡ 👇"
other_player: "ሌላ ተጫዋች"
no_pending_action: |-
  በአሁኑ ጊዜ ምንም የሚያደርጉት ነገር የለም። ወደ ግሩፑ በመሄድ በአሁኑ ዙር ለመሳተፍ ከነጻ ቁጥሮች አንዱን ይንኩ።

